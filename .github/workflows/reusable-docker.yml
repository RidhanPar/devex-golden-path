# Reusable container pipeline: build the image, scan it, and prove it starts.
#
#   build       Buildx with GitHub Actions layer cache
#   scan        Trivy image scan: OS packages + Python deps inside the final image
#   smoke test  run the container and require GET /health -> {"status": "ok"}
name: reusable-docker

on:
  workflow_call:
    inputs:
      enable-cache:
        description: Use the GitHub Actions cache for Docker layers
        type: boolean
        default: true
      source-artifact:
        description: Internal (template self-test) - artifact holding the source to build.
        type: string
        default: ""
      fail-severity:
        description: Minimum severity that fails the image scan
        type: string
        default: high

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  IMAGE: service:ci

jobs:
  container:
    name: build + image scan + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        if: inputs.source-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download generated source
        if: inputs.source-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.source-artifact }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: ${{ inputs.enable-cache && 'type=gha,scope=service-image' || '' }}
          cache-to: ${{ inputs.enable-cache && 'type=gha,scope=service-image,mode=max' || '' }}

      - name: Day stamp for the Trivy DB cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Trivy DB cache
        if: inputs.enable-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-

      - name: Trivy image scan
        env:
          FAIL_SEVERITY: ${{ inputs.fail-severity }}
        run: |
          case "${FAIL_SEVERITY,,}" in
            critical) severities=CRITICAL ;;
            high)     severities=HIGH,CRITICAL ;;
            *)        severities=MEDIUM,HIGH,CRITICAL ;;
          esac
          mkdir -p ~/.cache/trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --severity "$severities" --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Smoke test
        run: |
          docker run -d --name svc -p 8000:8000 "$IMAGE"
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8000/health); then
              echo "health: $body"
              echo "$body" | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become healthy within 30s"
          docker logs svc
          exit 1
      - name: Show image size and user
        if: always()
        run: |
          docker image ls "$IMAGE"
          echo "runs as user: $(docker inspect --format '{{.Config.User}}' "$IMAGE")"
